name: Deploy frontend to Hostinger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend-hostinger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.bowly.io
        run: npm run build

      - name: Install FTPS client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Deploy dist to Hostinger
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.HOSTINGER_FTP_REMOTE_DIR }}
          FTP_PORT: ${{ secrets.HOSTINGER_FTP_PORT || '21' }}
        run: |
          test -n "$FTP_HOST"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_REMOTE_DIR"

          FTP_HOST="${FTP_HOST#ftp://}"
          FTP_HOST="${FTP_HOST#ftps://}"
          FTP_HOST="${FTP_HOST%/}"

          echo "Connecting to Hostinger FTP on port $FTP_PORT..."

          lftp <<LFTP_COMMANDS
          set cmd:fail-exit yes
          set dns:order inet
          set net:max-retries 2
          set net:timeout 15
          set net:reconnect-interval-base 5
          set ftp:passive-mode true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          open -p "$FTP_PORT" -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST"
          cls -1
          mirror --reverse --delete --verbose \
            --exclude-glob .well-known/** \
            --exclude-glob .ftpquota \
            frontend/dist "$FTP_REMOTE_DIR"
          bye
          LFTP_COMMANDS
